<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CybrDial Embedded Widget Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.12), transparent 30rem),
          #09090b;
        color: #e2e8f0;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      .panel {
        border: 1px solid #1e293b;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.72);
        padding: 24px;
        backdrop-filter: blur(16px);
      }
      h1 {
        margin: 0 0 8px;
        letter-spacing: -0.03em;
      }
      p {
        color: #94a3b8;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 20px 0;
      }
      button {
        border: 1px solid #334155;
        border-radius: 10px;
        background: #0f172a;
        color: #e2e8f0;
        padding: 10px 14px;
        cursor: pointer;
      }
      button.primary {
        border-color: rgba(34, 211, 238, 0.4);
        background: #0891b2;
        color: #fff;
        font-weight: 700;
      }
      pre {
        min-height: 160px;
        max-height: 260px;
        overflow: auto;
        border: 1px solid #1e293b;
        border-radius: 12px;
        background: #020617;
        padding: 14px;
        color: #67e8f9;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>External Host Demo</h1>
        <p>
          This page represents a customer website embedding CybrDial through
          <code>/widget.js</code>.
        </p>
        <div class="actions">
          <button class="primary" id="open" type="button">Open</button>
          <button id="minimize" type="button">Minimize</button>
          <button id="close" type="button">Close</button>
          <button id="dial" type="button">Dial +57 300 206 1209</button>
        </div>
        <h2>PostMessage events</h2>
        <pre id="events" aria-live="polite">Waiting for widget events…</pre>
      </section>
    </main>

    <script
      src="/widget.js"
      data-position="right"
      data-theme="dark"
      data-open="true"
    ></script>
    <script>
      const events = document.getElementById("events");
      const recorded = [];

      function record(event) {
        recorded.unshift(
          `${new Date().toLocaleTimeString()} ${JSON.stringify(event.detail)}`,
        );
        events.textContent = recorded.slice(0, 30).join("\n");
      }

      window.addEventListener("cybrdial:widget", record);
      document.getElementById("open").addEventListener("click", () => {
        window.CybrDialWidget?.open();
      });
      document.getElementById("minimize").addEventListener("click", () => {
        window.CybrDialWidget?.minimize();
      });
      document.getElementById("close").addEventListener("click", () => {
        window.CybrDialWidget?.close();
      });
      document.getElementById("dial").addEventListener("click", () => {
        window.CybrDialWidget?.dial("+573002061209");
      });
    </script>
  </body>
</html>
